<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Jodi Scribble — Online Draw & Guess for Couples</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="Intimate, live draw and guess game crafted specifically for long-distance Indian couples.">
  <meta name="theme-color" content="#F6EEFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jodi Scribble">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg">

  <!-- Typography: Distinctive Indian Character (Rozha One + Baloo 2) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">

  <!-- Design System & Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Mobile App Frame Shell -->
  <main class="shell" id="shell">
    <div id="view" role="region" aria-live="polite"></div>
  </main>

  <!-- Celebratory Confetti Canvas Layer -->
  <div id="fx" aria-hidden="true"></div>

  <!-- Bottom Sheet & Dialog Modals -->
  <div id="modal" role="dialog" aria-modal="true"></div>

  <!-- Toast Notification Region -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Three.js 3D WebGL Engine & PeerJS WebRTC -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- Modular Scripts -->
  <script src="js/words.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/network.js"></script>
  <script src="js/race.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
